<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1f2937" />
  <title>German Trainer</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <button id="backBtn" class="topbar__back" type="button" aria-label="Back" title="Back" hidden>←</button>
    <button id="homeBtn" class="topbar__brand" type="button" aria-label="Go home">
      <span class="topbar__flag">🇩🇪</span>
      <span class="topbar__title">German Trainer</span>
    </button>
    <button id="acctBtn" class="btn btn--ghost topbar__acct" type="button" hidden>👤 Sign in</button>
  </header>

  <main id="app" class="app">
    <!-- Screens are rendered here by js/app.js -->
  </main>

  <!-- Supabase client library (from CDN; needs internet). If it fails to
       load, the app still works fully as a local guest. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="audio/manifest.js"></script>

  <!-- Data (raw word lists) -->
  <script src="data/verbs.js"></script>
  <script src="data/nouns.js"></script>
  <script src="data/adjectives.js"></script>
  <script src="data/phrases.js"></script>

  <!-- Engine + app -->
  <script src="js/german.js"></script>
  <script src="js/srs.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/flashcards.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/review.js"></script>
  <script src="js/browse.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
